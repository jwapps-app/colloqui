name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements-dev.txt

      # The web client's modules are syntax-checked and unit-tested under Node,
      # from pytest (tests/test_client_js.py). No npm packages are involved.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Lint
        working-directory: server
        run: ruff check

      - name: Run tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
          REQUIRE_NODE: "1"
        run: python -m pytest -q
